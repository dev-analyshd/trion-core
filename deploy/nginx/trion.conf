# TRION Protocol — Nginx Reverse Proxy Configuration
# Production deployment: SSL termination, rate limiting, CORS

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=signal_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Cache zone for static content
proxy_cache_path /var/cache/nginx/trion levels=1:2 keys_zone=trion_cache:100m max_size=1g inactive=24h;

upstream trion_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream trion_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name trion.example.com;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trion.example.com;
    
    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/trion.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trion.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CORS for API
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    
    # Connection limits
    limit_conn conn_limit 50;
    
    # ── API endpoints ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;
        
        proxy_pass http://trion_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }
    
    # Rate-limited signal endpoint (critical, expensive)
    location /api/v1/signal/ {
        limit_req zone=signal_limit burst=20 nodelay;
        
        proxy_pass http://trion_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    
    # ── Frontend ───────────────────────────────────────────────
    location / {
        proxy_pass http://trion_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Cache static assets
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
            proxy_pass http://trion_frontend;
            proxy_cache trion_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }
    
    # ── Socket.IO WebSocket push (serve.py flask-socketio, /feed namespace) ──
    # The dashboard's live signal feed (frontend/src/lib/socketio.ts) connects
    # same-origin to /socket.io/ — Next.js rewrites cannot proxy WebSocket
    # upgrades, so nginx terminates the WS here. Requires the api service to
    # run serve.py (flask-socketio); plain gunicorn api.app:app does NOT
    # serve this endpoint.
    location /socket.io/ {
        proxy_pass http://trion_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connection: engine.io pings every 25s keep it alive,
        # but the proxy read timeout must exceed the ping interval.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # ── Health check ───────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # ── Status ─────────────────────────────────────────────────
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
    
    # Logging
    access_log /var/log/nginx/trion.access.log;
    error_log /var/log/nginx/trion.error.log warn;
    
    # Max body size
    client_max_body_size 10m;
}
