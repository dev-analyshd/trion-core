# TRION Protocol — Prometheus Monitoring Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    cluster: trion-protocol
    environment: production

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ── TRION API Server ───────────────────────────────────────
  - job_name: "trion-api"
    static_configs:
      - targets: ["api:5000"]
    metrics_path: "/metrics"
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: trion-api

  # ── FAISS Engine ───────────────────────────────────────────
  - job_name: "trion-faiss"
    static_configs:
      - targets: ["faiss:8000"]
    metrics_path: "/metrics"
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: trion-faiss

  # ── Validator Node ─────────────────────────────────────────
  - job_name: "trion-validator"
    static_configs:
      - targets: ["validator:6000"]
    metrics_path: "/metrics"
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: trion-validator

  # ── Nginx ──────────────────────────────────────────────────
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
    metrics_path: "/nginx_status"

  # ── Node Exporter (host metrics) ───────────────────────────
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # ── cAdvisor (container metrics) ───────────────────────────
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
