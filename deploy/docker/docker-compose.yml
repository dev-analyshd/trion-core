# TRION Protocol — Docker Compose Multi-Service Stack
#
# What this deploys: the FULL TRION topology, one container per service —
# FAISS ANIMA (:8000), Oracle API + websocket (serve.py, :5000), the BH
# streamer (in-process inside the single serve.py process — see the api
# service TRION_STREAMER_INPROCESS note), the Go validator build+self-test
# gate (one-shot), the Next.js dashboard (:3000), nginx reverse proxy + the
# Prometheus/Grafana monitoring stack. All services are read-only observers
# of the chains — no relayer, no signing keys. The relayer/full stack lives
# in Dockerfile.render (render-entrypoint.sh) or runs standalone via
# supervisors/trion_and_zg_relayer.sh.
#
# Usage: docker-compose up -d

version: "3.8"

services:
  # ── FAISS Akashic Intelligence Engine ──────────────────────
  faiss:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.faiss
    container_name: trion-faiss
    restart: unless-stopped
    environment:
      - FAISS_PORT=8000
      - FAISS_INDEX_PATH=/data/faiss.index
      # Same live BH ledger the api/streamer writes (shared `ledger_data`
      # volume, mounted at /app/data) — the FAISS BH→vector scheduler and
      # /stats read the ledger the stack is actually producing.
      - BH_LEDGER_DB=/app/data/bh_ledger.db
    volumes:
      - faiss_data:/data
      - ledger_data:/app/data
      - ./logs:/app/logs
    networks:
      - trion_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Oracle API Server ──────────────────────────────────────
  # Runs serve.py (Flask + flask-socketio): serves the REST API on :5000 AND
  # the /socket.io/ websocket push channel (/feed namespace) that nginx
  # proxies and the dashboard's live signal feed consumes.
  #
  # Streamer profile: serve.py here is a SINGLE process (no gunicorn
  # workers), so the in-process BH streamer gate is the correct mode —
  # TRION_STREAMER_INPROCESS=1 (api/app.py default is 0, which is right for
  # gunicorn/multi-worker images). The docker entrypoint profile instead
  # runs the standalone scripts/run_bh_streamer.py + gate 0 here — never both.
  #
  # The BH ledger lives on the shared `ledger_data` volume (/app/data) —
  # mounted here (writer: serve.py + its in-process streamer) and in the
  # faiss service below (reader) so both see the same live ledger
  # (api/app.py resolves it via /app/bh_ledger.db, a symlink to
  # /app/data/bh_ledger.db baked into Dockerfile.api).
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: trion-api
    restart: unless-stopped
    depends_on:
      faiss:
        condition: service_healthy
    environment:
      - FLASK_ENV=production
      - FLASK_PORT=5000
      - PORT=5000
      - FAISS_SERVICE_URL=http://faiss:8000
      - TRION_STREAMER_INPROCESS=1
      - BH_LEDGER_DB=/app/data/bh_ledger.db
    volumes:
      - ledger_data:/app/data
      - ./logs:/app/logs
    networks:
      - trion_internal
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Validator (Go) — build + mesh/TRION-BFT self-test ───────
  # cmd/trion-validator is a ONE-SHOT self-test, not a daemon: it verifies
  # mesh primitives and a 4-validator TCP consensus round, prints PASS and
  # exits 0. Nothing listens on :6000 (the P2P gateway in
  # internal/p2p/gateway.go is test-only), so this service maps no ports,
  # declares no healthcheck and does not restart. Treat `docker compose up`
  # running it as a build + verification gate for the Go network layer.
  validator:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.validator
    container_name: trion-validator
    restart: "no"

  # ── Frontend Dashboard ─────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: trion-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - FLASK_URL=http://api:5000
      - NEXT_PUBLIC_API_URL=https://trion.example.com/api
    volumes:
      - ./logs:/app/logs
    networks:
      - trion_internal
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: trion-nginx
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    # SSL certificates: trion.conf expects them at /etc/letsencrypt/live/<domain>/
    # (Certbot layout). Provision them on the host and bind-mount that tree:
    #   - ./deploy/nginx/letsencrypt:/etc/letsencrypt:ro
    volumes:
      - ./deploy/nginx/trion.conf:/etc/nginx/conf.d/trion.conf:ro
      - ./deploy/nginx/letsencrypt:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
      - ./logs:/var/log/nginx
    networks:
      - trion_internal
      - trion_public

  # ── Monitoring (Prometheus + Grafana) ──────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: trion-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - trion_internal
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:latest
    container_name: trion-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - trion_internal
    ports:
      - "127.0.0.1:3001:3000"

networks:
  trion_internal:
    driver: bridge
    internal: true  # Only nginx connects to external
  trion_public:
    driver: bridge

volumes:
  faiss_data:
  ledger_data:
  nginx_cache:
  prometheus_data:
  grafana_data:
