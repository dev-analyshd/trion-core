[project]
name = "trion-core"
version = "1.0.0"
description = "TRION Protocol — Multi-Chain Behavioral Truth Oracle"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "bit>=0.8.0",
    "bitcoinlib>=0.7.8",
    "cosmpy>=0.11.2",
    "dilithium-py>=1.4.0",
    "email-validator>=2.3.0",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.1",
    "feedparser>=6.0.12",
    "flask==3.1.3",  # PHASE-1-SECURITY: bump (PYSEC-2026-1377, PYSEC-2026-2151)
    "flask-socketio>=5.6.1",
    # PHASE-1-SECURITY: transitive vuln pins (force minimum safe versions)
    "pynacl>=1.6.2",   # was 1.6.0 transitively — PYSEC-2026-3002
    "ecdsa==0.19.2",   # NO upstream fix yet for PYSEC-2026-1325; revisit
    "flask-sqlalchemy>=3.1.1",
    "gunicorn==23.0.0",
    "hdwallet>=3.6.1",
    "httpx>=0.28.1",
    "kyber-py>=1.2.0",
    "langdetect>=1.0.9",
    "mnemonic>=0.21",
    "numpy>=2.4.3",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.13.3",
    "pyspx>=0.5.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.0.0",
    "reportlab>=5.0.0",
    "requests>=2.33.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.15.0",
    "simple-websocket>=1.1.0",
    "stellar-sdk>=13.2.1",
    "torch>=2.13.0",
    "tronpy>=0.6.2",
    "uvicorn>=0.46.0",
    "vadersentiment>=3.3.2",
    "web3==7.15.0",
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
# ──────────────────────────────────────────────────────────────────────
# This section was auto-generated by `uv` when the pytorch-cpu index was
# added. It mapped 1000+ transitive ML packages (none of which are direct
# TRION dependencies) to the pytorch-cpu wheel index.
#
# These mappings are regenerated automatically by `uv lock` — they do NOT
# need to be committed. Removing them makes pyproject.toml human-readable.
#
# Audit finding #30: "pyproject.toml 2000+ line source mapping obscures deps"
# Status: TRIMMED. Run `uv lock` to regenerate if needed.
# ──────────────────────────────────────────────────────────────────────
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
