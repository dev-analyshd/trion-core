# =============================================================================
# TRION Protocol — Railway Deployment Configuration (TOML)
#
# Deploy to Railway:
#   1. Install Railway CLI: npm i -g @railway/cli
#   2. railway login
#   3. railway link (select your project)
#   4. railway up
#
# Or connect your GitHub repo at railway.com — Railway auto-detects this file.
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
startCommand = "/app/railway-entrypoint.sh"
healthcheckPath = "/readyz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.env]
HOSTNAME = "0.0.0.0"
FLASK_PORT = "5000"
FAISS_PORT = "8000"
FAISS_SERVICE_URL = "http://127.0.0.1:8000"
FAISS_URL = "http://127.0.0.1:8000"
ORACLE_API_URL = "http://127.0.0.1:5000"
FLASK_URL = "http://127.0.0.1:5000"
NODE_ENV = "production"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
TRION_ENABLE_FAISS = "1"
TRION_ENABLE_STREAMER = "1"
TRION_MAX_CHAINS = "12"
DATABASE_URL = ""
TIMESCALEDB_URL = ""
BH_LEDGER_DB = "/app/bh_ledger.db"
