# =============================================================================
# TRION Protocol — Railway Deployment Configuration v12.1 (MEMORY-SAFE LEAN)
#
# v12.1 fixes runtime OOM: streamer + backfill + FAISS index preload + all
# non-critical self-tests are OFF by default. The entrypoint also auto-detects
# cgroup memory < 1.5 GB and forces these off regardless of operator settings.
#
# To re-enable any component on a higher-RAM plan, set the corresponding
# TRION_ENABLE_* or TRION_FAISS_LOAD_INDEX env var to "1" in Railway Variables.
#
# NOTE: railway.json is the primary config (Railway prefers it). This file
# is kept for compatibility. Both files are kept in sync.
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
startCommand = "/app/railway-entrypoint.sh"
healthcheckPath = "/healthz"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.env]
HOSTNAME = "0.0.0.0"
PYTHONPATH = "/app"
FAISS_PORT = "8000"
FLASK_PORT = "5000"
FAISS_SERVICE_URL = "http://127.0.0.1:8000"
FAISS_URL = "http://127.0.0.1:8000"
FAISS_API_KEY = "trion-railway-key"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"

# Memory-safe lean defaults (v12.1) — flip to "1" on a plan with >= 2 GB RAM
TRION_ENABLE_STREAMER = "0"
TRION_FAISS_LOAD_INDEX = "0"
TRION_ENABLE_BACKFILL = "0"
TRION_MAX_CHAINS = "12"
TRION_ENABLE_VALIDATOR = "0"
TRION_ENABLE_SIGNAL_PROCESSING = "0"
TRION_ENABLE_RUST_INDEXERS = "0"
TRION_ENABLE_HASKELL_VERIFY = "0"
TRION_ENABLE_JULIA_MATH = "0"

DATABASE_URL = ""
TIMESCALEDB_URL = ""
BH_LEDGER_DB = "/app/bh_ledger.db"
