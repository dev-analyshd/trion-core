# =============================================================================
# TRION Protocol — Railway Deployment Configuration v12.0 (LEAN BUILD)
#
# NOTE: railway.json is the primary config (Railway prefers it). This file
# is kept for compatibility with tooling that reads the TOML format. Both
# files are kept in sync. The Dockerfile.railway v12.0 no longer runs
# compile-time builds for Rust/Go/C++/Haskell — only Python deps are
# installed at build time. All other toolchains are present at runtime
# for best-effort self-tests but are NOT on the /healthz critical path.
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
startCommand = "/app/railway-entrypoint.sh"
healthcheckPath = "/healthz"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.env]
HOSTNAME = "0.0.0.0"
PYTHONPATH = "/app"
FAISS_PORT = "8000"
FLASK_PORT = "5000"
FAISS_SERVICE_URL = "http://127.0.0.1:8000"
FAISS_URL = "http://127.0.0.1:8000"
FAISS_API_KEY = "trion-railway-key"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
TRION_ENABLE_STREAMER = "1"
TRION_ENABLE_VALIDATOR = "1"
TRION_ENABLE_SIGNAL_PROCESSING = "1"
TRION_ENABLE_RUST_INDEXERS = "1"
TRION_ENABLE_HASKELL_VERIFY = "1"
TRION_ENABLE_JULIA_MATH = "1"
TRION_MAX_CHAINS = "12"
DATABASE_URL = ""
TIMESCALEDB_URL = ""
BH_LEDGER_DB = "/app/bh_ledger.db"
