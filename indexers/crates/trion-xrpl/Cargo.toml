version = "2.1.0"
edition = "2021"
description = "TRION XRPL (XRP Ledger) behavioral indexer — public rippled JSON-RPC"

[[bin]]
name = "trion-xrpl"
path = "src/main.rs"

[dependencies]
trion-common = { path = "../trion-common" }
