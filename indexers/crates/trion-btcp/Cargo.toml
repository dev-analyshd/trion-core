[package]
name = "trion-btcp"
version = "0.1.0"
edition = "2021"
description = "BTCP — Behavioral Transaction Continuity Protocol (18 Rust modules)"
license = "CC0-1.0"

[dependencies]
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "trion_btcp"
path = "src/lib.rs"
