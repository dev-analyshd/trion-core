[workspace]
# Canonical SVM programs live in contracts/svm/programs/.
# Stale duplicates at chains/svm/programs/ were removed (CLEANUP-1).
members = [
    "../../contracts/svm/programs/btcp_escrow",
    "../../contracts/svm/programs/btcp_intent",
    "../../contracts/svm/programs/btcp_route",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3


