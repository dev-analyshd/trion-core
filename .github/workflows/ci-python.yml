name: CI Python
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install pytest numpy scipy scikit-learn flask flask-cors requests web3
          pip install feedparser vaderSentiment langdetect
          pip install -r api/requirements.txt -r anima-service/requirements.txt 2>/dev/null || true
      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ \
            --ignore=tests/unit/btcp_continuum/test_phase4_continuum.py \
            --ignore=tests/unit/btcp_continuum/test_phase5_integration.py \
            --ignore=tests/unit/test_beo_loop_closure.py \
            -q --tb=short
        continue-on-error: false
      - name: Run integration tests (non-blocking)
        run: |
          python -m pytest tests/unit/btcp_continuum/test_phase1_contracts.py \
            tests/unit/btcp_continuum/test_phase2_modules.py \
            tests/unit/btcp_continuum/test_phase3_endpoints.py \
            -q --tb=short
        continue-on-error: true
