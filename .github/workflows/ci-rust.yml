name: CI Rust
on: [push, pull_request]
jobs:
  indexers:
    name: Indexer workspace (21 chain crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check indexers
        run: cd indexers && cargo check --workspace
      - name: Test trion-common
        run: cd indexers && cargo test -p trion-common --lib

  btcp-core:
    name: BTCP core crate (19 spec modules, 94 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check BTCP core
        run: cd rust && cargo check
      - name: Test BTCP core
        run: cd rust && cargo test
