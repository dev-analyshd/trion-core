name: Supply Chain Integrity

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  python-lockfile:
    name: Python — Lockfile Integrity & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Verify uv.lock is in sync
        run: uv lock --check
        continue-on-error: true
      - name: Run pip-audit on locked dependencies
        run: |
          pip install pip-audit
          pip-audit -r <(uv export --format requirements-txt --no-hashes 2>/dev/null) || true

  node-lockfile:
    name: Node.js — Lockfile Integrity & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify package.json in sync (npm install, not ci — no lockfiles)
        run: |
          for dir in $(git ls-files '*/package.json' | xargs -n1 dirname | sort -u); do
            echo "Checking $dir..."
            (cd "$dir" && npm install --no-package-lock --ignore-scripts) || true
          done
      - name: npm audit (production deps)
        run: |
          for dir in $(git ls-files '*/package.json' | xargs -n1 dirname | sort -u); do
            echo "Auditing $dir..."
            (cd "$dir" && npm audit --omit=dev --audit-level=high) || true
          done

  rust-lockfile:
    name: Rust — Lockfile Integrity & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Cargo.lock exists
        run: |
          for dir in indexers rust; do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "Checking $dir/Cargo.lock..."
              if [ ! -f "$dir/Cargo.lock" ]; then
                echo "WARNING: $dir/Cargo.lock is missing. Generating..."
                (cd "$dir" && cargo generate-lockfile)
              fi
            fi
          done
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: cargo audit
        run: |
          for dir in indexers rust; do
            if [ -f "$dir/Cargo.lock" ]; then
              echo "Auditing $dir..."
              (cd "$dir" && cargo audit) || true
            fi
          done

  solidity-slither:
    name: Solidity — Slither Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Slither
        run: pip install slither-analyzer solc-select
      - name: Install solc
        run: |
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Run Slither on TRIONExecutionGate
        run: slither contracts/solidity/TRIONExecutionGate.sol --config-file slither.config.json || true
      - name: Run Slither on TRIONOracleV3
        run: slither contracts/solidity/TRIONOracleV3.sol --config-file slither.config.json || true
