name: Supply Chain Integrity

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Python: verify uv.lock is in sync with pyproject.toml + run pip-audit
  # ─────────────────────────────────────────────────────────────────────────────
  python-lockfile:
    name: Python — Lockfile Integrity & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Verify uv.lock is in sync
        run: |
          # `uv lock --check` exits 0 if the lockfile is up-to-date,
          # non-zero otherwise. This catches accidental dependency drift.
          uv lock --check

      - name: Run pip-audit on locked dependencies
        run: |
          pip install pip-audit
          # Audit the locked dependencies for known CVEs
          pip-audit -r <(uv export --format requirements-txt --no-hashes 2>/dev/null) \
            --ignore-vuln GHSA-EXAMPLE-IGNORE  # placeholder; remove when real

  # ─────────────────────────────────────────────────────────────────────────────
  # Node.js: verify package-lock.json is in sync + npm audit
  # ─────────────────────────────────────────────────────────────────────────────
  node-lockfile:
    name: Node.js — Lockfile Integrity & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # audit fix (SC-2): the loop listed `zg` which has no package.json (no-op),
      # while trion-0g/ and chains/<vm>/ (both with lockfiles) were unchecked.
      # Discover every directory that actually ships a package.json instead.
      - name: Verify package-lock.json in sync
        run: |
          # `npm ci` fails if package-lock.json is out of sync with package.json
          for dir in $(git ls-files '*/package.json' | xargs -n1 dirname | sort -u); do
            echo "Checking $dir..."
            (cd "$dir" && npm ci --ignore-scripts)
          done

      - name: npm audit (production deps)
        run: |
          for dir in $(git ls-files '*/package.json' | xargs -n1 dirname | sort -u); do
            echo "Auditing $dir..."
            (cd "$dir" && npm audit --omit=dev --audit-level=high || true)
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Rust: verify Cargo.lock is committed + cargo audit
  # ─────────────────────────────────────────────────────────────────────────────
  rust-lockfile:
    name: Rust — Lockfile Integrity & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Verify Cargo.lock exists
        run: |
          for dir in indexers; do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "Checking $dir/Cargo.lock..."
              if [ ! -f "$dir/Cargo.lock" ]; then
                echo "ERROR: $dir/Cargo.lock is missing. Run 'cargo generate-lockfile' and commit."
                exit 1
              fi
            fi
          done

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: cargo audit
        run: |
          for dir in indexers; do
            if [ -f "$dir/Cargo.lock" ]; then
              echo "Auditing $dir..."
              (cd "$dir" && cargo audit || true)
            fi
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Solidity: Slither static analysis
  # ─────────────────────────────────────────────────────────────────────────────
  solidity-slither:
    name: Solidity — Slither Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer solc-select

      - name: Install solc
        run: |
          solc-select install 0.8.20
          solc-select use 0.8.20

      # audit fix (SC-1): paths were pre-restructure (contracts/<X>.sol) — actual
      # locations are contracts/solidity/<X>.sol. The old paths always failed,
      # silently masked by `|| true`.
      - name: Run Slither on TRIONExecutionGate
        run: slither contracts/solidity/TRIONExecutionGate.sol --config-file slither.config.json || true

      - name: Run Slither on TRIONOracleV3
        run: slither contracts/solidity/TRIONOracleV3.sol --config-file slither.config.json || true

      - name: Run Slither on TRIONToken.vy
        run: slither contracts/vyper/TRIONToken.vy --config-file slither.config.json || true
