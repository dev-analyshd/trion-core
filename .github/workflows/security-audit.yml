name: Security Audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install numpy scipy scikit-learn flask flask-cors web3 requests
      - name: Run attack simulator
        run: python3 scripts/simulate_attacks.py
      - name: Run cross-language vector test
        run: python3 tests/unit/bh_cross_language_vector.py
