name: CI Go
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build validator
        run: cd validator && go build ./...
      - name: Test validator
        run: cd validator && go test ./...
        continue-on-error: true
