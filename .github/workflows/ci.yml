name: TRION Protocol CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test-python:
    name: Python — Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: |
          uv pip install --system \
            pytest numpy scipy scikit-learn \
            flask flask-sqlalchemy sqlalchemy \
            requests httpx uvicorn fastapi \
            faiss-cpu pydantic web3 \
            apscheduler feedparser langdetect \
            vadersentiment psycopg2-binary \
            ecdsa pynacl hypothesis \
            kyber-py dilithium-py pyspx
      - name: Five Planes — C(t) assembly, Θ(t), Silence
        run: python3 -m pytest tests/unit/test_all_planes.py -v --tb=short
      - name: Whitepaper gap coverage (84 formulas)
        run: python3 -m pytest tests/unit/test_whitepaper_gaps.py -v --tb=short
      - name: Trading signals — BTV, price feed, CEX
        run: python3 -m pytest tests/unit/test_trading_signals.py -v --tb=short
      - name: TRION protocol unit tests
        run: python3 -m pytest tests/unit/trion_protocol/ -v --tb=short
      - name: Deep VM and 0G integration
        run: python3 -m pytest tests/integration/test_deep_vm_and_zg.py -v --tb=short
      - name: Stress tests — concurrency, throughput, resilience
        run: python3 -m pytest tests/unit/test_stress.py -v --tb=short
      - name: Attack simulator self-test
        run: python3 scripts/simulate_attacks.py

  compile-solidity:
    name: Solidity — Hardhat Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Hardhat dependencies
        working-directory: hardhat
        run: npm install --legacy-peer-deps
      - name: Compile contracts
        working-directory: hardhat
        run: npx hardhat compile

  compile-rust:
    name: Rust — L0 Indexer Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust indexers
        run: cargo build --manifest-path indexers/Cargo.toml

  stress-test:
    name: Stress Test — 200 concurrent requests
    runs-on: ubuntu-latest
    needs: [test-python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install requests numpy flask flask-sqlalchemy faiss-cpu scikit-learn
      - name: Run stress test
        run: python3 scripts/stress_test.py --ci

  deploy:
    name: Deploy — Trigger Production Deploy
    runs-on: ubuntu-latest
    needs: [test-python, compile-solidity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Tolerated failure: the Render deploy hook is a POST to a secret URL.
      # Forks and PRs from contributors without the secret legitimately
      # cannot trigger deploys — this step is a notification, not a test.
      # Everything that GATES quality (test-python, compile-solidity,
      # compile-rust, stress-test) runs strict above.
      - name: Trigger Render deploy webhook
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}") || true
          BODY=$(cat /tmp/render_response.txt) || true
          echo "Render response (HTTP $HTTP_STATUS): $BODY"
          echo "Deploy triggered (may fail if secret not set)"
        continue-on-error: true
