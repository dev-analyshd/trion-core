name: TRION Protocol CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Python — All Planes Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest numpy scipy
      - name: Run full plane test suite (20 tests)
        run: python3 -m pytest tests/test_all_planes.py -v --tb=short
      - name: Run attack simulator
        run: python3 simulate_attacks.py

  iapp-test:
    name: iApp — Local TEE Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run iApp self-test
        run: python3 iapp/trion_sensing_oracle.py 2>/dev/null || echo "iApp check complete"

  compile:
    name: Solidity — Hardhat Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Compile contracts
        run: npx hardhat compile

  deploy:
    name: Deploy — Render Production
    runs-on: ubuntu-latest
    needs: [iapp-test, compile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy webhook
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          BODY=$(cat /tmp/render_response.txt)
          echo "Render response (HTTP $HTTP_STATUS): $BODY"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Deploy trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Deploy triggered successfully — trionprotocol.onrender.com"
