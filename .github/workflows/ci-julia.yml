name: CI Julia
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      # Audit fix (TEST-1): math/test/runtests.jl was a trivial placeholder
      # (1+1==2) that never imported TRIONMath. It is now a real suite over
      # every exported function — this workflow runs it on every push.
      - uses: julia-actions/julia-runtest@v1
        with:
          project: math
