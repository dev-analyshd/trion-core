name: CI Julia
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Run Julia tests
        run: |
          cd math
          julia --project=. -e '
            import Pkg
            Pkg.add("Test")
            Pkg.add("Statistics")
            Pkg.add("LinearAlgebra")
            include("test/runtests.jl")
          '
