name: CI Solidity
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd hardhat && npm install --legacy-peer-deps
      - run: cd hardhat && npx hardhat compile
