name: CI Haskell
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10'
      - name: Run theorem self-check
        run: runghc formal/src/TRION/Theorems.hs
        continue-on-error: true
      - name: Install hspec and run test suite
        run: |
          cabal update
          cabal install --lib hspec --package-env .
          runghc -i formal/src/TRION formal/test/Spec.hs
        continue-on-error: true
