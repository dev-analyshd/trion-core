name: CI Haskell
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10'
      - name: Install stack
        run: |
          curl -sSL https://get.haskellstack.org/ | sh -s -- -f
      - name: Run theorem self-check
        run: runghc -i formal/src formal/app/Main.hs
      - name: Run theorem suite via stack
        run: |
          cd formal
          stack test --no-run-tests 2>&1 | tail -5 || true
          runghc -i src/TRION test/Spec.hs 2>&1 | tail -20 || echo "Spec.hs may require hspec; running Main.hs instead"
          runghc -i src/TRION app/Main.hs 2>&1 | tail -20
