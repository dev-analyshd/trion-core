name: CI Haskell
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
      # Theorem self-check (unchanged — direct interpretation of the module)
      - run: runghc formal/src/TRION/Theorems.hs
      # hspec suite (audit fix TEST-2: was a println stub that tested nothing).
      # hspec is installed into the user package db, then Spec.hs is run
      # with the module dir on the import path.
      - run: cabal update
      - run: cabal install --lib hspec
      - run: runghc -i formal/src/TRION formal/test/Spec.hs
