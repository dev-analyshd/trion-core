name: CI TypeScript
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd sdk/src && npm install --legacy-peer-deps && npm install typescript
      - run: cd sdk/src && npx tsc --noEmit
