name: CI TypeScript
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd sdk/src && npm install --legacy-peer-deps
      - name: Install TypeScript
        run: cd sdk/src && npm install typescript --save-dev
      - name: Type check
        run: cd sdk/src && npx tsc --noEmit
