[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trion-sdk"
version = "0.1.0"
description = "TRION Protocol — Behavioral Truth Infrastructure Python SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC0" }
authors = [{ name = "TRION Protocol — Hudu Yusuf (Analys)" }]
dependencies = [
    "requests>=2.25",
]

[project.scripts]
trion-cli = "trion_sdk:connect"

[tool.setuptools]
py-modules = ["trion_sdk"]
