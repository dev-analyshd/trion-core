[package]
name = "trion-sdk"
version = "0.1.0"
edition = "2021"
description = "TRION Protocol SDK — behavioral truth oracle client (Rust)"
license = "CC0-1.0"
repository = "https://github.com/dev-analyshd/trion-core"
keywords = ["trion", "oracle", "behavioral", "defi", "blockchain"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"], default-features = false }
sha3 = "0.10"
hex = "0.4"
thiserror = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["full"], optional = true }

[features]
default = ["async"]
async = ["dep:tokio", "reqwest/rustls-tls"]
sync = []
