[package]
name = "trion-sdk"
version = "0.1.0"
edition = "2021"
description = "TRION Protocol Rust SDK — Behavioral Truth Infrastructure"
license = "CC0"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-test = "0.4"
