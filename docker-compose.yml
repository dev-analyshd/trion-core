# =============================================================================
# TRION Protocol — Docker Compose  (v5.0 — production-grade Railway parity)
#
# Three profiles, identical runtime contract as Railway:
#
#   dev       (default) Oracle API + FAISS only. Fast build (~3 min).
#   railway   parity-test the Railway image locally before pushing.
#   full      all optional subsystems (validator, signal processing, monitoring).
#
# Quick start (dev):
#   cp .env.example .env
#   docker compose up --build
#
# Railway local parity test:
#   docker compose --profile railway up --build
#
# Production full:
#   docker compose --profile full up --build
#
# Endpoints (dev):
#   http://localhost:5000/                            Oracle API (Flask; / redirects to FRONTEND_URL)
#   http://localhost:5000/api/v1/health                Oracle health
#   http://localhost:5000/readyz                       Readiness (503 → 200)
#   http://localhost:8000/healthz                       FAISS ANIMA alive
#   http://localhost:8000/readyz                        FAISS readiness
#
# Healthcheck model (new in v5):
#   /healthz     process is alive (always 200)
#   /readyz       ready to serve (200 only when deps also ready)
# =============================================================================

services:

  # ── Dev: Oracle API + FAISS ANIMA ─────────────────────────────────────────
  trion:
    build:
      context: .
      dockerfile: Dockerfile
    image: trion-core:dev
    profiles: ["dev", ""]
    ports:
      - "${PORT:-5000}:5000"
      - "${FAISS_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-5000}"
      FAISS_PORT: "8000"
      FLASK_PORT: "5000"
      FAISS_SERVICE_URL: "http://127.0.0.1:8000"
      FAISS_URL: "http://127.0.0.1:8000"
      ORACLE_API_URL: "http://127.0.0.1:5000"
      FLASK_URL: "http://127.0.0.1:5000"
      PYTHONUNBUFFERED: "1"
      # Streamer ON by default — entrypoint owns the single process
      TRION_ENABLE_STREAMER: "1"
      TRION_MAX_CHAINS: "${TRION_MAX_CHAINS:-12}"
      ZG_NETWORK: "mainnet"
      ZG_CHAIN_ID: "16661"
      ZERO_G_RPC: "https://evmrpc.0g.ai"
      ZG_EXECUTION_GATE_ADDR: "${ZG_EXECUTION_GATE_ADDR:-0xA85B49C73B5710d9ddB1CB5a94c52D0F33c4199b}"
    volumes:
      - faiss-data:/app/anima-service
      - zg-state:/app/0g-state
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/readyz"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  # ── Railway parity: identical image as production Railway deploy ───────────
  trion-railway:
    build:
      context: .
      dockerfile: Dockerfile.railway
    image: trion-core:railway
    profiles: ["railway"]
    ports:
      - "${PORT:-10000}:10000"
      - "${FAISS_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-10000}"
      FAISS_PORT: "8000"
      FLASK_PORT: "5000"
      FAISS_SERVICE_URL: "http://127.0.0.1:8000"
      FAISS_URL: "http://127.0.0.1:8000"
      ORACLE_API_URL: "http://127.0.0.1:5000"
      FLASK_URL: "http://127.0.0.1:5000"
      PYTHONUNBUFFERED: "1"
      NODE_ENV: "production"
      TRION_ENABLE_FAISS: "1"
      TRION_ENABLE_STREAMER: "1"
      TRION_MAX_CHAINS: "${TRION_MAX_CHAINS:-12}"
      TRION_ENABLE_RUST: "0"
      TRION_ENABLE_RELAYER: "0"
      TRION_ENABLE_ZG_SYNC: "0"
      TRION_ENABLE_ZG_DA: "0"
      TRION_ENABLE_EXTRAS: "0"
      TRION_ENABLE_NATIVE: "0"
      ZG_NETWORK: "mainnet"
      ZG_CHAIN_ID: "16661"
      ZERO_G_RPC: "https://evmrpc.0g.ai"
      ZG_EXECUTION_GATE_ADDR: "${ZG_EXECUTION_GATE_ADDR:-0xA85B49C73B5710d9ddB1CB5a94c52D0F33c4199b}"
    volumes:
      - faiss-data:/app/anima-service
      - zg-state:/app/0g-state
      - rust-logs:/tmp/trion-rust-logs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:10000/readyz"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  # ── Full production parity (all subsystems) ───────────────────────────────
  trion-full:
    build:
      context: .
      dockerfile: Dockerfile.render
    image: trion-core:full
    profiles: ["full"]
    ports:
      - "${PORT:-10000}:10000"
      - "${FAISS_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-10000}"
      FAISS_PORT: "8000"
      FLASK_PORT: "5000"
      FAISS_SERVICE_URL: "http://127.0.0.1:8000"
      FAISS_URL: "http://127.0.0.1:8000"
      ORACLE_API_URL: "http://127.0.0.1:10000"
      ZG_NETWORK: "mainnet"
      ZG_CHAIN_ID: "16661"
      ZERO_G_RPC: "https://evmrpc.0g.ai"
      ZG_EXECUTION_GATE_ADDR: "${ZG_EXECUTION_GATE_ADDR:-0xA85B49C73B5710d9ddB1CB5a94c52D0F33c4199b}"
      TRION_ENABLE_FAISS: "1"
      TRION_ENABLE_RUST: "1"
      TRION_ENABLE_EXTRAS: "1"
      TRION_ENABLE_NATIVE: "1"
      TRION_ENABLE_EXTENDED: "1"
      TRION_ENABLE_RELAYER: "1"
      TRION_ENABLE_NATIVE_RELAYER: "1"
      TRION_ENABLE_EXT_RELAYER: "1"
      TRION_ENABLE_ZG_SYNC: "1"
      TRION_ENABLE_ZG_DA: "1"
      TRION_ENABLE_VALIDATOR: "${TRION_ENABLE_VALIDATOR:-0}"
      TRION_ENABLE_SIGNAL_PROCESSING: "${TRION_ENABLE_SIGNAL_PROCESSING:-0}"
    volumes:
      - faiss-data:/app/anima-service
      - zg-state:/app/0g-state
      - rust-logs:/tmp/trion-rust-logs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:10000/readyz"]
      interval: 20s
      timeout: 8s
      start_period: 180s
      retries: 6
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "4"
        reservations:
          memory: 2g
          cpus: "1"

  # ── Optional Postgres for Akashic Index persistence (railway profile) ──────
  # When DATABASE_URL is set, the Akashic Index persists behavioral memory to
  # Postgres instead of local SQLite. Wire this service in with:
  #   docker compose --profile railway --profile postgres up
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: trion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trion_dev}
      POSTGRES_DB: trion_akashic
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trion -d trion_akashic"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  faiss-data:
    driver: local
  zg-state:
    driver: local
  rust-logs:
    driver: local
  pg-data:
    driver: local
