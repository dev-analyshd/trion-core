[package]
name = "btcp-escrow-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=1.17.30"
borsh = "0.10"
borsh-derive = "0.10"
blake3 = { version = "=1.5.0", features = ["traits-preview"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
