[package]
name = "trion-near-contracts"
version = "0.3.0"
edition = "2021"
authors = ["TRION Protocol <dev@trion.network>"]
description = "TRION Protocol — separate NEAR contracts (oracle, route, gate, token, staking). The combined contract under chains/near/contract/src/lib.rs is unchanged and remains the canonical deployment."

[lib]
path = "src/lib.rs"

[dependencies]
near-sdk = "5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
