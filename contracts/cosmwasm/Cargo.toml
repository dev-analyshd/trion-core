[package]
name = "trion-cosmwasm"
version = "2.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = "1.5"
cosmwasm-schema = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde-json-wasm = "1.0"
serde_json = "1.0"
schemars = "0.8"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
overflow-checks = true
