[package]
name = "trion-pvm-liquidity"
version = "0.1.0"
edition = "2021"
description = "TRION PVM Liquidity Commitment — ink! contract for Polkadot (mirrors LiquidityOcean.sol + BTCP_ESCROW.vy)"

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
]
ink-as-dependency = []

[dependencies]
ink        = { version = "5.0.0", default-features = false }
scale      = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2.6", default-features = false, features = ["derive"] }

[dev-dependencies]
ink_e2e = { version = "5.0.0" }

[profile.release]
overflow-checks = false
opt-level = "z"
lto = true
codegen-units = 1
