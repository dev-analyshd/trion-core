[package]
name    = "trion-evm"
version = "0.1.0"
edition = "2021"
description = "TRION EVM behavioral indexer — covers Arbitrum, Base, Optimism, HashKey, BNB, 0G Galileo"

[[bin]]
name = "trion-evm"
path = "src/main.rs"

[dependencies]
trion-common = { path = "../trion-common" }
tokio        = { workspace = true }
reqwest      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow       = { workspace = true }
async-trait  = "0.1"
