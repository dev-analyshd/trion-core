name: trion-formal
version: 1.0.0
synopsis: TRION Protocol formal verification — 9 theorems as types
license: CC0

dependencies:
  - base >= 4.14 && < 5

library:
  source-dirs: src/TRION
  exposed-modules: TRION.Theorems

executables:
  trion-verify:
    main: Main.hs
    source-dirs: app
    dependencies:
      - trion-formal

tests:
  spec:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - hspec
      - trion-formal
