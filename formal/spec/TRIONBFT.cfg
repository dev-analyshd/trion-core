\* TLC model-checker configuration for TRIONBFT.tla
\* Whitepaper Part 10 L4 — "BFT safety proof in TLA+"
\*
\* Run with:
\*   java -jar tla2tools.jar -config TRIONBFT.cfg TRIONBFT.tla
\*
\* The spec lives next to this file in TRIONBFT.tla. We model-check a small
\* finite validator set so the state space stays bounded and TLC can actually
\* exhaust it; the constants and invariants below are the ones referenced by
\* the spec.

\* --- Constants (must match the CONSTANT declarations in the .tla module) ---
CONSTANTS
    ValidatorSet = {v1, v2, v3, v4, v5}
    MaxStake = 100

\* --- Initialization and next-state predicates --------------------------------
\* Spec == Init /\ [][Next]_vars  in the module; TLC wants Init and Next.
INIT Init
NEXT Next

\* --- Invariants to check -----------------------------------------------------
\* SafetyProperty: no two certified signals conflict for the same entity.
INVARIANT SafetyProperty

\* --- Properties (commented out by default; uncomment to check liveness) -------
\* LivenessProperty above is temporal — enable it with PROPERTY once the
\* safety invariant passes, e.g.:
\* PROPERTY LivenessProperty
